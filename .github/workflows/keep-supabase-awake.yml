# Supabase pauses a free project after a week without database activity,
# and a paused project stays down until it is resumed by hand. An
# exchange created months before its draw date would sit idle long
# enough to be paused, and the draw would never run.
#
# This reads a single row every three days, which is enough to count as
# activity. It does nothing until both repository secrets are set, so it
# is safe to have here before the project exists.
#
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon key, which is meant to be public
#
# The service role key is not used here and must never be a secret this
# workflow can read.

name: Keep Supabase awake

on:
  schedule:
    # Daily, not every third day. Supabase's own guidance is that a few
    # requests *each day* over the previous week keep a project awake,
    # and they do not publish the threshold, so a three-day gap is a
    # guess with the whole app riding on it. A request a day costs
    # nothing. Not on the hour: scheduled jobs pile up there and GitHub
    # drops the overflow.
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Knock on the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY is not set."
            echo "Add them under Settings -> Secrets and variables -> Actions."

            # Pressing Run workflow is somebody asking whether this
            # works, and a green tick that only means "nothing was
            # configured" answers the wrong question. On the schedule it
            # stays quiet, so a project that does not exist yet does not
            # send an email every three days.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              exit 1
            fi

            exit 0
          fi

          # ping() exists for this. It touches no table and returns
          # nobody's data, so the only thing it can tell you is whether
          # the database answered, which is the only thing being asked.
          code=$(curl -sS --max-time 30 -o /tmp/out.txt -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')

          echo "HTTP $code"
          cat /tmp/out.txt

          # A paused project does not answer at all, so anything other
          # than a healthy 200 with the answer in it is worth an email.
          if [ "$code" != "200" ] || ! grep -q '"awake"' /tmp/out.txt; then
            echo
            echo "Supabase did not answer as expected. The project may be"
            echo "paused, or the key may be wrong. Open the dashboard."
            exit 1
          fi

          echo
          echo "Project is awake."
