name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck, draw tests, and render tests. A failure here stops
      # the deploy, so a broken build never reaches the live site.
      - run: npm run check

      # Vite bakes these into the bundle at build time, so the live
      # site needs them here rather than at runtime. Both are public:
      # the publishable key is in the JavaScript every visitor
      # downloads and reaches nothing without a token. The secret key
      # is deliberately not named anywhere in this file.
      #
      # Missing secrets do not fail the build. The app says it cannot
      # save anything and still runs, which beats a deploy that stops
      # because a value was renamed.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
