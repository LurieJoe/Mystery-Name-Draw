<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mystery Name Draw</title>
    <meta
      name="description"
      content="Organize a gift exchange without making anyone create an account. Set a budget, invite people by link, and let everyone choose their own restrictions."
    />

    <!--
      Every invitee receives a link, so these decide what that link looks
      like when it arrives in an email or a message. Routes live in the
      URL fragment, which is never sent to the server, so every link
      shares this one preview rather than naming its exchange.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mystery Name Draw" />
    <meta property="og:title" content="Mystery Name Draw" />
    <meta
      property="og:description"
      content="You have been invited to a gift exchange. Register to add your wishlist and set your own restrictions."
    />
    <meta property="og:url" content="https://mysterynamedraw.com/" />
    <meta
      property="og:image"
      content="https://mysterynamedraw.com/images/logo-primary-v1.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mystery Name Draw" />
    <meta
      name="twitter:description"
      content="You have been invited to a gift exchange. Register to add your wishlist and set your own restrictions."
    />
    <meta
      name="twitter:image"
      content="https://mysterynamedraw.com/images/logo-primary-v1.png"
    />

    <meta name="theme-color" content="#6d28d9" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
